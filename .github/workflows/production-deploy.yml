name: Render Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build & Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Oxlint Code Quality Check
        run: npm run lint

      - name: Compile TypeScript & Vite Production Bundle
        run: npm run build

      - name: Run Backend & FTUX Test Verification Suite (51 Tests)
        run: |
          npx tsx test/backend-production.test.ts
          npx tsx test/desktop-auth-configuration.test.ts
          npx tsx test/desktop-login.test.ts
          npx tsx test/ftux-e2e.test.ts
          npx tsx test/application-routing.test.ts
          npx tsx test/meeting-detection.test.ts
          npx tsx test/google-auth.test.ts
          npx tsx test/google-calendar.test.ts

  security-scan:
    name: Security Vulnerability Scan
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  deploy-to-render:
    name: Trigger Render Production Deployment
    needs: [validate-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Web Service Deployment via Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not set. Render GitHub integration will deploy automatically on push to main."
          else
            echo "🚀 Triggering zero-downtime deployment on Render..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully initiated!"
            else
              echo "❌ Render deploy hook returned HTTP status: $HTTP_STATUS"
              echo "$RESPONSE"
              exit 1
            fi
          fi

      - name: Verify Production Health Probe (Optional Smoke Test)
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.noteflow.ai' }}
        run: |
          echo "Waiting 20 seconds for Render rolling deployment..."
          sleep 20
          echo "Probing $API_URL/health..."
          curl -f -m 10 "$API_URL/health" || echo "Note: Initial probe timed out during cold build; Render will continue zero-downtime rollout."
