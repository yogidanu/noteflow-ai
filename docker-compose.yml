version: "3.8"

# Secrets are NEVER committed here. Every secret is interpolated from an
# untracked .env file next to this compose file; ${VAR:?} makes compose
# fail loudly when one is missing instead of booting with a public value.
# Required in .env: TOKEN_ENCRYPTION_KEY (64 hex), SESSION_SECRET (32+
# chars), POSTGRES_PASSWORD, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# DEEPGRAM_API_KEY.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteflow-meet-record-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=https://noteflow-ai-cc3p.vercel.app
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:3000,https://noteflow-ai-cc3p.vercel.app,https://app.noteflow.ai
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:?set DEEPGRAM_API_KEY in .env}
      - DATABASE_URL=postgresql://noteflow_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/noteflow_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: noteflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=noteflow_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=noteflow_db
    ports:
      # Localhost only — never publish the database on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteflow_user -d noteflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noteflow-redis
    restart: unless-stopped
    ports:
      # Localhost only — same reasoning as postgres.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
