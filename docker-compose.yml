version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteflow-meet-record-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=https://noteflow-ai-cc3p.vercel.app
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:3000,https://noteflow-ai-cc3p.vercel.app,https://app.noteflow.ai
      - TOKEN_ENCRYPTION_KEY=dev-only-generate-your-own-key
      - SESSION_SECRET=dev-only-generate-your-own-secret
      - DATABASE_URL=postgresql://noteflow_user:noteflow_secret_password@postgres:5432/noteflow_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: noteflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=noteflow_user
      - POSTGRES_PASSWORD=dev-only-password
      - POSTGRES_DB=noteflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteflow_user -d noteflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noteflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
