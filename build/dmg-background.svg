<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <defs>
    <linearGradient id="dmg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  
  <!-- Canvas -->
  <rect width="660" height="400" fill="url(#dmg-bg)"/>
  
  <!-- App Title Banner -->
  <text x="330" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">
    NoteFlow AI • Meet Record
  </text>
  <text x="330" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">
    Drag NoteFlow AI to Applications folder to install
  </text>
  
  <!-- Sleek Drag Arrow -->
  <g transform="translate(290, 190)" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="20" x2="70" y2="20"/>
    <polyline points="55,5 70,20 55,35"/>
  </g>
</svg>
