<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
  
  <!-- Central AI Intelligence Spark Beacon -->
  <path d="M 256 128 L 288 224 L 384 256 L 288 288 L 256 384 L 224 288 L 128 256 L 224 224 Z" fill="url(#spark-grad)"/>
  
  <!-- Secondary Accents -->
  <circle cx="352" cy="160" r="16" fill="#A5B4FC" opacity="0.8"/>
  <circle cx="160" cy="352" r="12" fill="#A5B4FC" opacity="0.6"/>
</svg>
