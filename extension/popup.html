<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }
    .title { font-size: 14px; font-weight: 600; }
    .status-card {
      margin-top: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .status-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .status-val { font-size: 13px; font-weight: 600; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">✦</div>
    <div>
      <div class="title">NoteFlow AI</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-label">In-Meeting Companion</div>
    <div class="status-val">
      <span class="dot"></span>
      <span>Active & Detecting</span>
    </div>
  </div>

  <button id="open-dashboard" class="btn">
    <span>Open NoteFlow Workspace ↗</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
